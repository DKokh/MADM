[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madm"
version = "0.1.0"
description = "MADM -- multi-assay antibody developability: structures, features, training, inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Daria B. Kokh"}]
keywords = ["antibody", "developability", "polyreactivity", "machine-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Only needed when streams includes "feat" -- structure prediction and 3D features.
# INCOMPLETE ON PURPOSE: ImmuneBuilder also needs `openmm` and `pdbfixer`, and
# `anarci` needs HMMER. pdbfixer is not on PyPI and openmm ships compiled CUDA
# kernels, so pip cannot install either; listing them here would make this extra
# fail to resolve rather than work. Get them from conda first:
#     conda install -c conda-forge openmm pdbfixer
#     conda install -c bioconda anarci hmmer
# Only needed when model.embedder names an ESM variant. AbLang2 is the default
# and comes from the `ablang2` package instead.
esm = [
    "transformers>=4.30",
]
structure = [
    "ImmuneBuilder>=1.1",   # structure prediction
    "biotite>=0.39",        # PDB parsing, SASA, contacts
    "hydride",              # protonation
    "mdtraj",               # geometry
    "propka",               # pKa / charge
    "anarci",               # IMGT numbering (needs HMMER, from bioconda)
]
# Only needed when streams includes "ablang".
ablang = ["ablang2>=0.1"]
plots = ["matplotlib>=3.6"]
all = ["madm[structure,ablang,plots]"]

[project.scripts]
madm = "madm.cli:main"

[tool.setuptools.packages.find]
include = ["madm*"]

# The two hydrophobicity/SASA lookup tables the feature extractor reads. They are
# INPUTS to featurisation, small, and never change -- so they ship inside the
# package. Without this, `pip install madm` gives you an extractor with nothing to
# look up, and `paths.reference_tables` becomes a required setting pointing at a
# directory the user has to obtain separately.
[tool.setuptools.package-data]
madm = ["reference/*.xlsx"]

# `models/` is NOT packaged: the bundles are hundreds of MB, and a path outside
# the package directory is not reliably installable anyway. `madm models` looks
# next to the source tree by default and takes `--dir` otherwise, and it reports
# an entry whose bundle.pt is missing rather than failing at predict time.
